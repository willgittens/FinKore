[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finkore-python"
version = "0.1.0"
description = "Repository reference Python implementation of FinKore Core 0.9 release-candidate behavior."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "FinKore maintainers" }]
keywords = ["finkore", "financial-domain", "reference-implementation"]

[project.optional-dependencies]
coverage = ["coverage[toml]>=7.6,<8"]

[tool.coverage.run]
branch = true
source = ["finkore"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finkore = ["py.typed"]
