[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finkore-python"
version = "0.1.0"
description = "Python implementation of FinKore Core Draft behavior."
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
authors = [{ name = "FinKore maintainers" }]

[tool.setuptools.packages.find]
where = ["src"]
