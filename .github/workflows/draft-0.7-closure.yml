name: Draft 0.7 Closure Verification

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Bootstrap repository toolchains
        run: npm run tools:bootstrap:draft0.5

      - name: Verify Draft 0.7 closure evidence
        run: npm run verify:closure:draft0.7
